syntax = "proto3";

package types;

option go_package = "./;types";

// Message
message Message {
  // @gotags: json:"msg_id"
  string msg_id = 1;
  // @gotags: json:"client_id"
  string client_id = 2;
  // @gotags: json:"session_id"
  string session_id = 3;
  // @gotags: json:"from_user_id"
  uint64 from_user_id = 4;
  // @gotags: json:"msg_type"
  int32 msg_type = 5;
  // @gotags: json:"seq"
  uint64 seq = 6 [jstype = JS_STRING];
  // @gotags: json:"content"
  string content = 7;
  // @gotags: json:"media_url"
  string media_url = 8;
  // @gotags: json:"extra"
  string extra = 9;
  // @gotags: json:"status"
  int32 status = 10;
  // @gotags: json:"create_time"
  int64 create_time = 11;
}

message Session {
  // @gotags: json:"session_id"
  string session_id = 1;
  // @gotags: json:"type"
  int32 type = 2;
  // @gotags: json:"session_key"
  string session_key = 3;
  // @gotags: json:"max_seq"
  uint64 max_seq = 4 [jstype = JS_STRING];
  // @gotags: json:"actual_seq"
  uint64 actual_seq = 5 [jstype = JS_STRING];
  // @gotags: json:"last_content"
  string last_content = 6;
  // @gotags: json:"last_sender"
  uint64 last_sender = 7;
  // @gotags: json:"create_time"
  int64 create_time = 8;
  // @gotags: json:"update_time"
  int64 update_time = 9;
}

// UserSession
message UserSession {
  // @gotags: json:"user_id"
  uint64 user_id = 1;
  // @gotags: json:"session_id"
  string session_id = 2;
  // @gotags: json:"is_top"
  int32 is_top = 3;
  // @gotags: json:"is_disturb"
  int32 is_disturb = 4;
  // @gotags: json:"last_read_seq"
  uint64 last_read_seq = 5 [jstype = JS_STRING];
  // @gotags: json:"create_time"
  int64 create_time = 6;
  // @gotags: json:"update_time"
  int64 update_time = 8;
  // @gotags: json:"unread_count"
  uint64 unread_count = 9;
}

// GetHistoryReq
message GetHistoryReq {
  // @gotags: form:"session_id,optional" json:"session_id,optional"
  string session_id = 1;
  // @gotags: form:"start_seq,optional" json:"start_seq,optional"
  int64 start_seq = 2 [jstype = JS_STRING];
  // @gotags: form:"end_seq,optional" json:"end_seq,optional"
  int64 end_seq = 3 [jstype = JS_STRING];
  // @gotags: form:"limit,optional,default=20" json:"limit,optional"
  int32 limit = 4;
}

// GetHistoryResp
message GetHistoryResp {
  // @gotags: json:"list"
  repeated Message list = 1;
}

// UpdateSessionReq
message UpdateSessionReq {
  // @gotags: json:"session_id"
  string session_id = 1;
  // @gotags: json:"session_key"
  string session_key = 2;
  // @gotags: json:"is_top,optional"
  int32 is_top = 3;
  // @gotags: json:"is_disturb,optional"
  int32 is_disturb = 4;
}

// GetUserSessionsResp
message GetUserSessionsResp {
  // @gotags: json:"sessions"
  repeated UserSession sessions = 1;
}

message GetUserActiveSessionsReq {
  // @gotags: form:"timestamp,optional" json:"timestamp,optional"
  int64 timestamp = 1;
}

message GetUserActiveSessionsResp {
  // @gotags: json:"sessions"
  repeated Session sessions = 1;
}

// MarkSessionReadReq 上报会话已读游标
message MarkSessionReadReq {
  // @gotags: json:"session_id"
  string session_id = 1;
  // @gotags: json:"read_seq"
  uint64 read_seq = 2 [jstype = JS_STRING];
}

// RecallMessageReq 撤回消息（操作者由服务端从 JWT 解析）
message RecallMessageReq {
  // @gotags: json:"msg_id"
  string msg_id = 1;
  // @gotags: json:"session_id"
  string session_id = 2;
}

message RecallMessageResp {}

// GetSessionReq 根据 session_id 或 session_key 查询会话
message GetSessionReq {
  // @gotags: form:"session_id,optional" json:"session_id,optional"
  string session_id = 1;
  // @gotags: form:"session_key,optional" json:"session_key,optional"
  string session_key = 2;
  // @gotags: form:"session_type,optional" json:"session_type,optional"
  int32 session_type = 3;
}

// GetSessionResp
message GetSessionResp {
  // @gotags: json:"session"
  Session session = 1;
}

// ─────────────────────────────────────────────────────────────────────────────
// TURN 短时凭证
//
// coturn 以 use-auth-secret 模式运行：不存用户表，凭证由服务端用共享密钥
// （static-auth-secret）现算，coturn 收到后用同一密钥校验。
//
//   username   = "<过期 Unix 秒>:<userId>"
//   credential = base64(HMAC-SHA1(secret, username))
//
// 必须走这条路而不能把固定账号密码写进客户端：TURN 是通用流量中继，
// 密码一旦泄漏就会被拿去白嫖带宽，而本服务出向带宽只有 2 Mbps。
// ─────────────────────────────────────────────────────────────────────────────

// GetTurnCredentialReq 获取 TURN 凭证（用户身份由服务端从 JWT 解析，请求体为空）
message GetTurnCredentialReq {}

// IceServer 与 WebRTC 的 RTCIceServer 字段一一对应，客户端可直接使用
message IceServer {
  // @gotags: json:"urls"
  repeated string urls = 1;
  // STUN 条目不需要凭证，这两个字段为空
  // @gotags: json:"username"
  string username = 2;
  // @gotags: json:"credential"
  string credential = 3;
}

message GetTurnCredentialResp {
  // @gotags: json:"ice_servers"
  repeated IceServer ice_servers = 1;
  // 凭证过期时间（Unix 秒）。客户端据此在发起通话前判断是否需要重新拉取，
  // 不要缓存超过该时间，否则 coturn 会拒绝分配中继。
  // @gotags: json:"expires_at"
  int64 expires_at = 2 [jstype = JS_STRING];
}